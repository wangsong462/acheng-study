<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>阿澄的学习工作台</title>
<style>
/* ============================================================
   阿澄的学习工作台 · 绿色护眼主题样式
   ============================================================ */
:root{
  --green:        #4CAF50;   /* 主绿（侧边栏/顶栏） */
  --green-light:  #55B85A;   /* 主绿渐变亮色 */
  --green-dark:   #2E7D32;   /* 深绿（主按钮） */
  --green-deep:   #1B5E20;   /* 更深绿（标题文字） */
  --bg:           #E9F5E3;   /* 页面浅绿背景 */
  --card:         #FFFFFF;   /* 卡片底色 */
  --card-green:   #DDF1D2;   /* 题目卡片浅绿 */
  --border:       #CBE7BC;   /* 卡片描边 */
  --text:         #1F4020;   /* 正文深色 */
  --muted:        #5B7A52;   /* 次要文字 */
  --yellow:       #FFB300;   /* 太阳积分色 */
  --red:          #E53935;   /* 录音红 */
  --sidebar-w:    74px;      /* 侧边栏宽度 */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#D9EBD1;
  color:var(--text);
  overflow:hidden;
  /* 适合小学生：禁止长按选中、禁止点选复制 */
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}

/* ---------- 整体骨架：左侧固定侧边栏 + 右侧内容 ---------- */
#app{
  display:flex;
  height:100vh;          /* 旧浏览器回退 */
  height:100dvh;         /* 手机动态视口，避开微信浏览器地址栏 */
  max-width:480px;margin:0 auto;
  background:var(--bg);
  box-shadow:0 0 24px rgba(0,0,0,.12);
}
@media (min-width:520px){        /* 电脑预览时像一台手机 */
  #app{height:calc(100dvh - 40px);margin:20px auto;border-radius:24px;overflow:hidden}
}

/* ---------- 左侧固定侧边导航栏 ---------- */
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:linear-gradient(180deg,var(--green-light),var(--green));
  display:flex;flex-direction:column;align-items:center;
  padding:10px 0 14px;gap:7px;overflow-y:auto;
}
.sidebar .logo{font-size:24px;margin-bottom:4px}
.nav-item{
  width:58px;padding:7px 0 6px;border:none;border-radius:14px;
  background:rgba(255,255,255,.92);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:12.5px;font-weight:700;color:var(--green-deep);
  box-shadow:0 2px 4px rgba(0,0,0,.08);
  cursor:pointer;touch-action:manipulation;
}
.nav-item .ico{font-size:21px;line-height:1.1;display:flex;align-items:center;justify-content:center;height:24px}
.nav-item .ico.abc{                       /* “英语 abc”小图标（还原截图蓝色小方块） */
  background:#90CAF9;color:#fff;border-radius:8px;
  font-size:13px;font-weight:800;padding:3px 7px;height:auto;
}
.nav-item .ico.num{                       /* 数字徽章（如数学“3”代表三年级） */
  background:var(--green);color:#fff;border-radius:50%;
  width:22px;height:22px;font-size:13px;font-weight:800;
}
.nav-item:active{transform:scale(.94)}
.nav-item.active{
  background:#fff;
  box-shadow:0 0 0 2px var(--yellow),0 3px 8px rgba(0,0,0,.18);
}

/* ---------- 右侧：顶部积分栏 + 滚动内容 ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{
  height:54px;flex:0 0 54px;
  background:linear-gradient(90deg,var(--green-light),var(--green));
  display:flex;align-items:center;padding:0 10px;gap:7px;
}
.brand{display:flex;align-items:center;gap:5px;color:#fff;font-weight:800;font-size:14.5px;white-space:nowrap}
.brand .sun-logo{font-size:19px}
.sun-chip{
  display:flex;align-items:center;gap:4px;background:#fff;border-radius:999px;
  padding:4px 10px;font-weight:800;color:#E65100;font-size:15px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.08);white-space:nowrap;
}
.progress-wrap{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.progress{flex:1;height:12px;background:rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFD54F,#FFB300);border-radius:999px;transition:width .4s}
.progress-text{color:#fff;font-weight:700;font-size:12px;white-space:nowrap}

.content{flex:1;overflow-y:auto;padding:12px 12px 30px;-webkit-overflow-scrolling:touch}
.page{display:none}
.page.active{display:block}

/* 右下角小僵尸装饰（还原截图角落小僵尸） */
.deco{position:absolute;right:2px;bottom:4px;font-size:42px;opacity:.5;pointer-events:none;z-index:1}

/* ---------- 通用卡片 / 标题 ---------- */
.card{
  background:var(--card);border:1.5px solid var(--border);border-radius:18px;
  padding:14px;margin-bottom:14px;
  box-shadow:0 2px 6px rgba(46,125,50,.07);
}
.card h2{font-size:17.5px;font-weight:800;color:var(--green-deep);display:flex;align-items:center;gap:7px}
.subtitle{font-size:12.5px;color:var(--muted);margin:5px 0 12px;line-height:1.5}
.page-title{font-size:20px;font-weight:800;color:var(--green-deep);margin:2px 2px 12px;display:flex;align-items:center;gap:8px}

/* 课文/古诗切换胶囊按钮 */
.pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--green-dark);color:#fff;font-weight:700;font-size:14.5px;
  border:none;border-radius:999px;padding:8px 15px;cursor:pointer;
  box-shadow:0 2px 0 var(--green-deep);touch-action:manipulation;
}
.pill:active{transform:translateY(2px);box-shadow:none}
.pill .caret{font-size:11px;opacity:.9}

/* 题目卡片（浅绿底） */
.q-card{
  background:var(--card-green);border-radius:14px;padding:12px 14px;
  font-size:16.5px;font-weight:700;line-height:1.55;color:var(--text);
  margin:10px 0 12px;
}
/* 选项按钮：白底绿边，答对变绿、答错变红并高亮正确答案 */
.opt{
  display:block;width:100%;text-align:left;background:#fff;
  border:2px solid var(--border);border-radius:14px;
  padding:12px 14px;margin-bottom:10px;
  font-size:16px;font-weight:600;color:#0F5132;
  cursor:pointer;touch-action:manipulation;transition:background .15s,border-color .15s;
}
.opt:active{background:#F1F9EC}
.opt.correct{background:#DFF3DC;border-color:var(--green);color:var(--green-deep)}
.opt.wrong{background:#FDECEA;border-color:var(--red);color:#B71C1C}
.opt:disabled{cursor:default;opacity:1}

/* 按钮行：下一题 + 已完成标识 */
.btn-row{display:flex;gap:10px;margin-top:12px;align-items:center}
.btn-primary{
  background:var(--green-dark);color:#fff;border:none;border-radius:999px;
  padding:11px 22px;font-size:16px;font-weight:800;cursor:pointer;
  box-shadow:0 3px 0 var(--green-deep);touch-action:manipulation;
}
.btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-deep)}
.badge-done{
  background:#E4E4E4;color:#7A7A7A;border-radius:999px;
  padding:9px 15px;font-size:14px;font-weight:800;
  display:inline-flex;align-items:center;gap:5px;
}
.badge-done.on{background:#DFF3DC;color:var(--green-deep);border:2px solid var(--green)}
.btn-record{
  width:100%;margin-top:6px;background:var(--green-dark);color:#fff;
  border:none;border-radius:999px;padding:14px;font-size:16.5px;font-weight:800;
  cursor:pointer;box-shadow:0 3px 0 var(--green-deep);touch-action:manipulation;
}
.btn-record:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-deep)}

/* 答题反馈文字 */
.feedback{margin-top:10px;font-size:14.5px;font-weight:700;min-height:22px;line-height:1.5}
.feedback.ok{color:var(--green-dark)}
.feedback.no{color:#C62828}
.progress-hint{font-size:12.5px;color:var(--muted);margin-top:8px;font-weight:600}

/* ---------- 商店：植物卡片 ---------- */
.plant{
  position:relative;background:#fff;border:2px solid var(--border);border-radius:16px;
  padding:16px 10px 14px;margin-bottom:12px;text-align:center;cursor:pointer;
  touch-action:manipulation;transition:transform .1s;
}
.plant:active{transform:scale(.97);border-color:var(--green)}
.plant .emo{font-size:44px;line-height:1.2}
.plant .name{font-size:17px;font-weight:800;color:var(--text);margin-top:6px}
.plant .price{color:#E65100;font-weight:800;font-size:15.5px;margin-top:3px}
.plant .owned{
  position:absolute;top:8px;right:8px;background:#DFF3DC;color:var(--green-deep);
  border:1.5px solid var(--green);border-radius:999px;padding:2px 9px;
  font-size:12px;font-weight:800;
}

/* ---------- 花园：已购植物格子 ---------- */
.garden-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.g-item{background:var(--card-green);border:1.5px solid var(--border);border-radius:14px;padding:14px 4px 10px;text-align:center}
.g-item .emo{font-size:36px;line-height:1.2}
.g-item .name{font-size:13.5px;font-weight:800;color:var(--green-deep);margin-top:5px}
.g-item .count{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.garden-empty{text-align:center;padding:34px 10px}
.garden-empty .big{font-size:56px}
.garden-empty p{font-size:15.5px;font-weight:700;color:var(--muted);line-height:1.8;margin:10px 0 16px}

/* ---------- 弹窗（遮罩 + 居中模态框） ---------- */
.mask{
  position:fixed;inset:0;background:rgba(20,40,15,.5);
  display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.mask.show{display:flex}
.modal{
  background:#fff;border-radius:22px;width:100%;max-width:360px;padding:20px;
  position:relative;animation:pop .22s ease;max-height:86vh;overflow-y:auto;
}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:18.5px;font-weight:800;color:var(--green-deep);display:flex;align-items:center;gap:8px}
.modal .close{
  position:absolute;top:10px;right:14px;font-size:24px;font-weight:800;
  color:#1E88E5;background:none;border:none;cursor:pointer;line-height:1;padding:4px;
}
/* 课文/古诗选择列表 */
.pick-list{margin-top:14px}
.pick-item{
  display:flex;align-items:center;width:100%;text-align:left;
  background:#fff;border:2px solid var(--border);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;font-size:14.5px;font-weight:700;color:var(--text);
  cursor:pointer;touch-action:manipulation;
}
.pick-item .st{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;padding-left:8px}
.pick-item.active{border-color:var(--green-dark);background:#F1F9EC}

/* ---------- 古诗背诵录音弹窗 ---------- */
.poem-card{background:var(--card-green);border-radius:16px;padding:16px 14px;margin:14px 0 6px;text-align:center}
.poem-card .pt{font-size:17.5px;font-weight:800;color:var(--green-deep)}
.poem-card .pl{font-size:16.5px;line-height:2.05;color:#1F4020;font-weight:600;margin-top:4px}
.mic-wrap{text-align:center;margin-top:10px}
.mic{
  width:88px;height:88px;border-radius:50%;border:4px solid var(--red);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:34px;margin:6px auto;
  cursor:pointer;touch-action:manipulation;
}
.mic:active{transform:scale(.95)}
.mic.recording{background:#FFEBEE;animation:pulse 1.2s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(229,57,53,.45)}
  70%{box-shadow:0 0 0 16px rgba(229,57,53,0)}
  100%{box-shadow:0 0 0 0 rgba(229,57,53,0)}
}
.mic-tip{text-align:center;font-size:13.5px;color:var(--muted);font-weight:700;margin-bottom:16px;min-height:20px}
.btn-submit{
  width:100%;background:var(--green-dark);color:#fff;border:none;border-radius:999px;
  padding:14px;font-size:16.5px;font-weight:800;cursor:pointer;
  box-shadow:0 3px 0 var(--green-deep);touch-action:manipulation;
}
.btn-submit:disabled{background:#BDBDBD;box-shadow:none;cursor:default}
.btn-submit:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-deep)}

/* ---------- 轻提示 Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);
  background:rgba(27,94,32,.94);color:#fff;padding:11px 20px;border-radius:999px;
  font-size:14.5px;font-weight:700;opacity:0;pointer-events:none;transition:.28s;
  z-index:99;max-width:82%;text-align:center;line-height:1.5;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.abc-big{font-size:44px;font-weight:800;color:#1E88E5;letter-spacing:2px}

/* ============================================================
   对对碰 · 记忆翻牌
   ============================================================ */
.level-row{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.pill.small{font-size:13px;padding:7px 13px}
.pill.lv-active{background:var(--green-deep);box-shadow:0 0 0 2px var(--yellow),0 2px 0 var(--green-deep)}
.match-grid{display:grid;gap:10px;margin:12px 0 4px}
.match-grid.cols3{grid-template-columns:repeat(3,1fr)}
.match-grid.cols4{grid-template-columns:repeat(4,1fr)}
.match-grid.cols5{grid-template-columns:repeat(5,1fr)}
.flip{perspective:600px;aspect-ratio:3/4;border:none;background:none;padding:0;cursor:pointer;touch-action:manipulation}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.flip .face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(22px,7vw,32px);border:2px solid var(--border);
}
.flip .back{background:linear-gradient(135deg,#66BB6A,#43A047);color:#fff}
.flip .front{background:#fff;transform:rotateY(180deg)}
.flip.matched .front{background:#DFF3DC;border-color:var(--green);box-shadow:0 0 0 2px #FFE082}
.flip.matched{animation:matchpop .3s}
@keyframes matchpop{50%{transform:scale(1.12)}}
.flip:disabled{cursor:default}

/* ============================================================
   抓大鹅 · 限时反应游戏
   ============================================================ */
.duck-hud{display:flex;gap:10px;margin:12px 0}
.hud-box{flex:1;background:var(--card-green);border:1.5px solid var(--border);border-radius:14px;padding:9px 4px;text-align:center}
.hud-box .v{font-size:21px;font-weight:800;color:var(--green-deep);line-height:1.2}
.hud-box .k{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.duck-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 14px}
.duck-grid.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.hole{
  position:relative;height:96px;border-radius:50% 50% 14px 14px;
  background:radial-gradient(ellipse at center,#8D6E63 0%,#6D4C41 70%);
  border:3px solid #5D4037;overflow:hidden;cursor:pointer;
  box-shadow:inset 0 8px 12px rgba(0,0,0,.25);
}
.duck-pop{position:absolute;left:50%;bottom:-70px;transform:translateX(-50%);font-size:42px;transition:bottom .18s ease;line-height:1;pointer-events:none}
.duck-pop.show{bottom:8px}

/* 游戏结算卡片（对对碰 / 抓大鹅 共用） */
.game-result{background:var(--card-green);border:2px solid var(--green);border-radius:16px;padding:16px 12px;text-align:center;margin-top:8px}
.game-result .big{font-size:21px;font-weight:800;color:var(--green-deep)}
.game-result .stars{font-size:26px;margin:6px 0;letter-spacing:4px}
.game-result .sub{margin:4px 0 12px}

/* ============================================================
   运动打卡
   ============================================================ */
.sport-item{
  display:flex;align-items:center;width:100%;text-align:left;background:#fff;
  border:2px solid var(--border);border-radius:16px;padding:14px 15px;margin-bottom:11px;
  font-size:16.5px;font-weight:700;color:var(--text);cursor:pointer;touch-action:manipulation;
}
.sport-item:active{transform:scale(.98)}
.sport-item .ico{font-size:26px;margin-right:12px}
.sport-item.done{background:#DFF3DC;border-color:var(--green);color:var(--green-deep)}
.sport-item.done .txt{text-decoration:line-through;opacity:.75}
.sport-item .ck{margin-left:auto;font-size:13.5px;font-weight:800;color:var(--muted)}
.sport-item.done .ck{color:var(--green-dark)}
.week-dots{display:flex;gap:6px;justify-content:space-between;margin-top:8px}
.day-dot{flex:1;text-align:center}
.day-dot .d{width:30px;height:30px;border-radius:50%;background:#E4E4E4;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#8a8a8a}
.day-dot.on .d{background:var(--green);color:#fff}
.day-dot .l{font-size:10px;color:var(--muted);margin-top:3px;font-weight:700}
</style>
</head>
<body>

<div id="app">
  <!-- 左侧固定侧边导航栏（由 JS 生成 8 个入口） -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- 右侧主体 -->
  <div class="main">
    <!-- 顶部：向日葵 + 标题 + 太阳积分 + 进度条 -->
    <header class="topbar">
      <div class="brand"><span class="sun-logo">🌻</span><span>阿澄的学习工作台</span></div>
      <div class="sun-chip">☀️&nbsp;<span id="sunNum">0</span></div>
      <div class="progress-wrap">
        <div class="progress"><i id="sunBar"></i></div>
        <span class="progress-text" id="sunText">0/10</span>
      </div>
    </header>

    <!-- 可滚动内容区：每个导航对应一个页面 -->
    <div class="content" id="content">
      <section class="page" id="page-chinese"></section>
      <section class="page" id="page-math"></section>
      <section class="page" id="page-english"></section>
      <section class="page" id="page-sport"></section>
      <section class="page" id="page-match"></section>
      <section class="page" id="page-duck"></section>
      <section class="page" id="page-garden"></section>
      <section class="page" id="page-shop"></section>
    </div>

    <!-- 右下角小僵尸装饰 -->
    <div class="deco">🧟</div>
  </div>
</div>

<!-- 弹窗1：选择课文 / 单元 / 古诗（通用，由 JS 按类型填充） -->
<div class="mask" id="mask-pick">
  <div class="modal">
    <h3 id="pickTitle">📚 选择课文</h3>
    <button class="close" data-act="close-mask" data-target="mask-pick">✕</button>
    <div class="pick-list" id="pickList"></div>
  </div>
</div>

<!-- 弹窗3：古诗背诵录音 -->
<div class="mask" id="mask-record">
  <div class="modal">
    <h3>🎤 古诗背诵录音</h3>
    <button class="close" data-act="close-mask" data-target="mask-record">✕</button>
    <div class="poem-card">
      <div class="pt" id="recTitle">山行 · 杜牧</div>
      <div class="pl" id="recLines"></div>
    </div>
    <div class="mic-wrap">
      <div class="mic" id="micBtn" data-act="rec-toggle">🎤</div>
      <div class="mic-tip" id="micTip">点击开始录音</div>
    </div>
    <button class="btn-submit" id="recSubmit" data-act="rec-submit" disabled>📮 提交背诵</button>
  </div>
</div>

<!-- 轻提示 -->
<div id="toast"></div>

<script>
/* ============================================================
 * 阿澄的学习工作台 —— 纯前端 H5（无后端 / 无登录）
 * 适配：微信内置浏览器，绿色护眼风格
 * ------------------------------------------------------------
 * ★ 想添加题目 / 修改题库？只需改下面几个数据数组：

function addPoints(n, reason, silent){
  if(n <= 0) return;
  if(HARD_CAP && state.points + n > POINT_GOAL){
    toast('今天的目标 '+POINT_GOAL+'☀️ 已达到，先去商店逛逛吧～');

  save();
  renderHeader();

/* 通用答题卡片：课文 / 数学单元 / 英语单元 / 古诗 都是同一套外观，
   以后想改题目卡片样式，只改这一个函数即可。 */
function quizCardHTML(cfg){
  var k = cfg.kind, conf = QUIZ_KINDS[k];
  var idx = cfg.idx, quiz = conf.list[idx];
  var q = quiz.qs[cfg.qIdx];
  var key = k + idx + '-' + cfg.qIdx;
  var answered = state.answers[key] !== undefined;
  var chosen = state.answers[key];
  var done = state[conf.doneKey].indexOf(idx) > -1;

  var html = '<h2>'+conf.icon+' '+cfg.name+'</h2>'
    + '<div class="subtitle">'+cfg.sub+'</div>'
    + '<button class="pill" data-act="open-pick" data-mode="'+cfg.mode+'">'+cfg.unitLabel+' <span class="caret">▾</span></button>'
    + '<div class="q-card">'+conf.icon+' 第'+(cfg.qIdx+1)+'/'+quiz.qs.length+'题：'+q.q+'</div>';
  /* 选项：答对变绿✅、答错变红❌并高亮正确答案，答过就锁死不能重复得分 */
  for(var i=0;i<q.o.length;i++){
    var cls = 'opt', mark = '';
    if(answered){
      if(i === q.a){ cls += ' correct'; mark = ' ✅'; }
      else if(i === chosen){ cls += ' wrong'; mark = ' ❌'; }
    }
    html += '<button class="'+cls+'" data-act="answer" data-kind="'+k+'" data-q="'+cfg.qIdx+'" data-o="'+i+'"'+(answered?' disabled':'')+'>'+q.o[i]+mark+'</button>';
  }
  /* 答题反馈文字 */
  html += '<div class="feedback '+(answered ? (chosen===q.a ? 'ok' : 'no') : '')+'">'
        + (answered ? (chosen===q.a ? '答对啦，真棒！☀️ +1' : '答错啦～正确答案是「'+q.o[q.a]+'」') : '')
        + '</div>';
  /* 本课/本单元进度小提示（showHint=false 的古诗卡片不显示） */
  if(cfg.showHint){
    var doneCnt = 0, rightCnt = 0;
    for(var d=0;d<quiz.qs.length;d++){
      var kk = k+idx+'-'+d;
      if(state.answers[kk] !== undefined){ doneCnt++; if(state.answers[kk] === quiz.qs[d].a) rightCnt++; }
    }
    html += '<div class="progress-hint">本'+conf.name+'已完成 '+doneCnt+'/'+quiz.qs.length+' 题 · 答对 '+rightCnt+' 题</div>';
  }
  /* 下一题 / 下一课 / 下一单元 + 已完成标识 */
  var nextLabel = conf.nextLabels[cfg.qIdx === quiz.qs.length-1 ? 1 : 0];
  html += '<div class="btn-row">'
        +   '<button class="btn-primary" data-act="next" data-kind="'+k+'">'+nextLabel+'</button>'
        +   '<span class="badge-done'+(done?' on':'')+'">✅ 已完成</span>'
        + '</div>';
  if(cfg.extra) html += cfg.extra;   // 古诗卡片额外挂一个“录音背诵”按钮
  return html;
}

/* ---------- 13. 答题与完成判定（语文/数学/英语/古诗通用） ---------- */
function handleAnswer(kind, qIdx, optIdx){
  var idx = viewIdx(kind);
  var key = kind + idx + '-' + qIdx;
  if(state.answers[key] !== undefined) return;      // 每题只能答一次
  var conf = QUIZ_KINDS[kind];
  var quiz = conf.list[idx];
  state.answers[key] = optIdx;
  save();
  var correct = (quiz.qs[qIdx].a === optIdx);
  if(correct) addPoints(1, '答对啦');
  checkDone(kind);        /* 可能标记完成并发放额外奖励 */
  renderCurrent();        /* 统一放在最后：保证“已完成”标识立即点亮 */
  if(!correct) toast('再想想～正确答案是「'+ quiz.qs[qIdx].o[quiz.qs[qIdx].a] +'」');
}
/* 全部题目答完 → 标记完成；全部答对 → 额外奖励 */
function checkDone(kind){
  var idx = viewIdx(kind);
  var conf = QUIZ_KINDS[kind];
  var quiz = conf.list[idx];
  var allAnswered = true, allCorrect = true;
  for(var i=0;i<quiz.qs.length;i++){
    var v = state.answers[kind+idx+'-'+i];
    if(v === undefined){ allAnswered = false; break; }
    if(v !== quiz.qs[i].a) allCorrect = false;
  }
  if(!allAnswered) return;
  if(state[conf.doneKey].indexOf(idx) > -1) return;
  state[conf.doneKey].push(idx);
  save();
  buildPickList();
  var label = (kind==='L') ? lessonTitle(idx) : (kind==='P') ? '《'+quiz.title+'》' : quiz.t;
  toast('🎉 '+label+' 全部完成！');
  if(allCorrect) addPoints(LESSON_BONUS, '全部答对额外奖励');
}
/* 下一题 / 下一课 / 下一单元：答完自动跳到当前单元第一道未答的题 */
function firstUnanswered(kind, idx, total){
  for(var i=0;i<total;i++){
    if(state.answers[kind+idx+'-'+i] === undefined) return i;
  }
  return 0;
}
function nextQ(kind){
  var conf = QUIZ_KINDS[kind];
  var idx = viewIdx(kind);
  var total = conf.list[idx].qs.length;
  if(viewQ(kind) < total-1){
    /* 本单元内：直接下一题（暂时跳过也没关系，
       以后从选择器重新进入本单元时，会自动定位到第一道未答的题） */
    setViewQ(kind, viewQ(kind)+1);
  }else{
    /* 本题是本题型的最后一题：进入下一课/下一单元，全部学完则循环回第1个 */
    if(idx < conf.list.length-1){
      setViewIdx(kind, idx+1);
      toast('进入下一'+conf.name+'：'+conf.list[idx+1].t);
    }else{
      setViewIdx(kind, 0);
      toast('太棒了！全部学完，回到第1'+conf.name+'～');
    }
    setViewQ(kind, 0);
    /* 进入新单元：自动定位到第一道未答的题，接着学 */
    var ni = viewIdx(kind);
    setViewQ(kind, firstUnanswered(kind, ni, conf.list[ni].qs.length));
  }
  renderCurrent();
}

/* ---------- 15. 古诗背诵录音弹窗（调用浏览器麦克风） ---------- */
var rec = { stream:null, mr:null, chunks:[], sec:0, timer:null, hasRec:false };
function openRecord(){
  var P = POEMS[view.poem];
  $('recTitle').textContent = P.title + ' · ' + P.author;
  $('recLines').innerHTML = P.lines.join('<br>');
  rec.hasRec = false; rec.chunks = []; rec.sec = 0;
  updateRecUI();
  openMask('mask-record');
}
function toggleRec(){
  if(rec.mr && rec.mr.state === 'recording'){ stopRec(); return; }
  /* 请求麦克风（iOS 微信需在用户点击事件中调用，这里正好是点击麦克风按钮） */
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('当前环境不支持录音，请在微信里打开本页面～');
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    rec.stream = stream;
    try{
      rec.mr = new MediaRecorder(stream);
    }catch(e){
      toast('当前微信版本不支持网页录音，请升级微信试试～');
      recCleanup();
      return;
    }
    rec.chunks = []; rec.hasRec = false;
    rec.mr.ondataavailable = function(e){ if(e.data && e.data.size) rec.chunks.push(e.data); };
    rec.mr.onstop = function(){ rec.hasRec = rec.chunks.length > 0; updateRecUI(); };
    rec.mr.start();
    rec.sec = 0;
    rec.timer = setInterval(function(){ rec.sec++; updateRecUI(); }, 1000);
    updateRecUI();
  }).catch(function(){
    toast('无法使用麦克风～请在微信「设置」里允许使用麦克风');
  });
}
function stopRec(){
  if(rec.mr && rec.mr.state !== 'inactive'){ try{ rec.mr.stop(); }catch(e){} }
  if(rec.timer){ clearInterval(rec.timer); rec.timer = null; }
  updateRecUI();
}
/* 关闭弹窗时彻底释放麦克风 */
function recCleanup(){
  if(rec.mr && rec.mr.state !== 'inactive'){ try{ rec.mr.stop(); }catch(e){} }
  if(rec.stream){ rec.stream.getTracks().forEach(function(t){ t.stop(); }); rec.stream = null; }
  if(rec.timer){ clearInterval(rec.timer); rec.timer = null; }
  rec.mr = null; rec.chunks = []; rec.hasRec = false;
}
function updateRecUI(){
  var mic = $('micBtn'), tip = $('micTip'), sub = $('recSubmit');
  if(rec.mr && rec.mr.state === 'recording'){
    mic.classList.add('recording');
    mic.textContent = '⏹';
    tip.textContent = '🔴 正在录音 '+fmtTime(rec.sec)+' · 再点一次停止';
    sub.disabled = true;
  }else if(rec.hasRec){
    mic.classList.remove('recording');
    mic.textContent = '🎤';
    tip.textContent = '✅ 录音完成（'+fmtTime(rec.sec)+'），可以提交背诵啦';
    sub.disabled = false;
  }else{
    mic.classList.remove('recording');
    mic.textContent = '🎤';
    tip.textContent = '点击开始录音';
    sub.disabled = true;
  }
}
function submitRecitation(){
  if(!rec.hasRec){
    toast('请先点击麦克风完成录音，再提交背诵哦～');
    return;
  }
  var idx = view.poem;
  if(state.recited.indexOf(idx) === -1){
    state.recited.push(idx);
    save();
    buildPickList();
    addPoints(1, '背诵奖励');
  }else{
    toast('这次也背得很棒！');
  }
  closeMask('mask-record');
}

/* ---------- 18. 小游戏与运动打卡（对对碰 / 抓大鹅 / 运动打卡） ---------- */

/* ===== 18.1 运动打卡 ===== */
/* 打卡清单：想增删项目，只改这个数组即可 */
var SPORT_ITEMS = ['跳绳100下', '跑步10分钟', '坐位体前屈', '眼保健操', '拍球50下'];
var SPORT_DAILY_CAP = 1;   // 运动打卡每天最多获得的阳光数（现为1次）
var GAME_DAILY_LIMIT = 2;  // 对对碰 + 抓大鹅 每天合计最多领取的阳光奖励次数

function pad2(n){ return (n<10?'0':'')+n; }
/* 生成日期字符串：dayStr(0)=今天，dayStr(-1)=昨天 */
function dayStr(offset){
  var d = new Date();
  d.setDate(d.getDate() + offset);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function renderSport(){
  var today = dayStr(0);
  var doneMap = state.sportToday[today] || {};
  var doneCount = 0;
  for(var k in doneMap) if(doneMap[k]) doneCount++;
  var claimed = (state.sportPointDay === today);   // 今日阳光是否已领过

  var html = '<div class="page-title">🏃 运动打卡</div>'
    + '<div class="card">'
    +   '<h2>🏃 每日运动打卡</h2>'
    +   '<div class="subtitle">' + today + ' · 每天可领 ' + SPORT_DAILY_CAP + '☀ · 已连续打卡 🔥 ' + (state.sportStreak||0) + ' 天</div>';
  for(var i=0;i<SPORT_ITEMS.length;i++){
    var done = !!doneMap[i];
    html += '<button class="sport-item'+(done?' done':'')+'" data-act="sport-toggle" data-idx="'+i+'">'
      +   '<span class="ico">'+(done?'✅':'⭕')+'</span>'
      +   '<span class="txt">'+SPORT_ITEMS[i]+'</span>'
      +   '<span class="ck">'+(done?'已完成':'去打卡')+'</span>'
      + '</button>';
  }
  if(claimed) html += '<div class="progress-hint">今日运动阳光已领取 ✅ 继续坚持运动，身体棒棒！</div>';
  /* 最近 7 天打卡记录（小圆点） */
  html += '<div class="progress-hint" style="margin-top:14px">最近7天打卡记录</div><div class="week-dots">';
  for(var d=6;d>=0;d--){
    var ds = dayStr(-d);
    var on = (state.sportHistory[ds]||0) > 0;
    var lbl = (d===0) ? '今天' : ds.slice(5);
    html += '<div class="day-dot'+(on?' on':'')+'"><div class="d">'+(on?'✓':'·')+'</div><div class="l">'+lbl+'</div></div>';
  }
  html += '</div></div>';
  $('page-sport').innerHTML = html;
}
/* 点击某项：完成 / 取消完成（取消不扣积分，防刷分靠“每日上限”控制） */
function sportToggle(idx){
  var today = dayStr(0);
  if(!state.sportToday[today]) state.sportToday[today] = {};
  var doneMap = state.sportToday[today];
  if(doneMap[idx]){
    delete doneMap[idx];
    save(); renderSport();
    return;
  }
  doneMap[idx] = true;
  var cnt = 0;
  for(var k in doneMap) if(doneMap[k]) cnt++;
  /* 连续天数：今天第一次打卡时计算（昨天打过 → +1，否则重新开始数） */
  if(cnt === 1 && state.sportLastDay !== today){
    state.sportStreak = (state.sportLastDay === dayStr(-1)) ? (state.sportStreak||0) + 1 : 1;
    state.sportLastDay = today;
  }
  state.sportHistory[today] = cnt;
  /* 只保留最近 45 天历史，防止 localStorage 无限膨胀 */
  var keys = Object.keys(state.sportHistory).sort();
  while(keys.length > 45){ delete state.sportHistory[keys[0]]; keys.shift(); }
  save();
  /* 每天只能领 1 次阳光：以“领取日期”为准，取消再打卡也不会重复发 */
  if(state.sportPointDay !== today){
    state.sportPointDay = today;
    save();
    addPoints(1, '运动打卡');
  }else{
    toast('已完成「'+SPORT_ITEMS[idx]+'」！今日运动阳光已领过，明天再来～');
  }
  renderSport();
}

/* ===== 小游戏每日奖励（对对碰 + 抓大鹅 合计每天最多 GAME_DAILY_LIMIT 次） ===== */
function gameRewardLeft(){
  var today = dayStr(0);
  return Math.max(0, GAME_DAILY_LIMIT - (state.gameRewards[today] || 0));
}
/* 领取一次小游戏阳光奖励；返回是否真正领到（当天领完则只提示、不扣次数） */
function claimGameReward(points, reason){
  var today = dayStr(0);
  var used = state.gameRewards[today] || 0;
  if(used >= GAME_DAILY_LIMIT){
    toast('今日小游戏奖励已领完（每天'+GAME_DAILY_LIMIT+'次），明天再来～');
    return false;
  }
  state.gameRewards[today] = used + 1;
  /* 只保留最近 45 天记录，防止 localStorage 无限膨胀 */
  var keys = Object.keys(state.gameRewards).sort();
  while(keys.length > 45){ delete state.gameRewards[keys[0]]; keys.shift(); }
  save();
  addPoints(points, reason);
  return true;
}

/* ===== 18.2 对对碰（记忆翻牌） ===== */
/* 三档难度：简单 4×3=12张(6对) / 普通 4×4=16张(8对) / 困难 5×4=20张(10对) */
var MATCH_LEVELS = {
  easy:  {name:'简单', pairs:6,  cols:4},
  normal:{name:'普通', pairs:8,  cols:4},
  hard:  {name:'困难', pairs:10, cols:5}
};
/* 牌面图案（植物大战僵尸主题，按顺序取前 pairs 个） */
var MATCH_EMOJIS = ['🌻','🧟','🌰','🍒','🌶️','🌱','🦆','🎯','👻','⭐'];
/* 本局游戏状态（内存态，刷新页面重开一局） */
var game = { match:{ level:'normal', cards:[], matchedSet:{}, first:-1, second:-1, lock:false, steps:0, startTime:0, finished:false, matched:0, result:null } };

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function startMatch(level){
  var conf = MATCH_LEVELS[level];
  var pool = MATCH_EMOJIS.slice(0, conf.pairs);
  game.match = {
    level:level, cards:shuffle(pool.concat(pool)), matchedSet:{},
    first:-1, second:-1, lock:false, steps:0,
    startTime:Date.now(), finished:false, matched:0, result:null
  };
  renderMatch();
}
/* 星级评定：steps=翻牌回合数（翻两张算一步），全对无失误 = pairs 步
   3⭐=失误很少(≤pairs+2步)  2⭐=一般(≤1.5倍)  1⭐=再加油 */
function matchStars(steps, pairs){
  if(steps <= pairs + 2) return 3;
  if(steps <= Math.ceil(pairs * 1.5)) return 2;
  return 1;
}
function renderMatch(){
  var m = game.match, conf = MATCH_LEVELS[m.level];
  var started = (m.steps > 0 || m.first !== -1 || m.finished);
  var best = state.matchBest[m.level];
  var lvHtml = '';
  for(var key in MATCH_LEVELS){
    var lv = MATCH_LEVELS[key];
    lvHtml += '<button class="pill small'+(m.level===key?' lv-active':'')+'" data-act="match-level" data-level="'+key+'">'+lv.name+'</button>';
  }
  var html = '<div class="page-title">🎯 对对碰</div>'
    + '<div class="card">'
    +   '<h2>🎯 记忆翻牌</h2>'
    +   '<div class="subtitle">翻开两张卡牌，图案相同就配对成功，每配对一对 +1☀～</div>'
    +   '<div class="level-row">'+lvHtml+'</div>'
    +   '<div class="duck-hud">'
    +     '<div class="hud-box"><div class="v">'+conf.name+'</div><div class="k">当前难度</div></div>'
    +     '<div class="hud-box"><div class="v">'+m.matched+'/'+conf.pairs+'</div><div class="k">已配对</div></div>'
    +     '<div class="hud-box"><div class="v">'+m.steps+'</div><div class="k">翻牌步数</div></div>'
    +   '</div>';
  if(best) html += '<div class="progress-hint">本难度最佳纪录：'+best.steps+' 步 / '+best.time+' 秒</div>';
  html += '<div class="progress-hint">今日小游戏奖励还剩 '+gameRewardLeft()+' 次（每天最多'+GAME_DAILY_LIMIT+'次）</div>';
  /* 牌桌 */
  html += '<div class="match-grid cols'+conf.cols+'">';
  for(var i=0;i<m.cards.length;i++){
    var isOpen = (m.first===i || m.second===i);
    var isMatched = !!m.matchedSet[i];
    var cls = 'flip' + ((isOpen||isMatched) ? ' flipped' : '') + (isMatched ? ' matched' : '');
    html += '<button class="'+cls+'" data-act="match-card" data-i="'+i+'"'
          + ((isOpen||isMatched||m.lock||m.finished)?' disabled':'') + '>'
          +   '<span class="inner">'
          +     '<span class="face back">🌻</span>'
          +     '<span class="face front">'+m.cards[i]+'</span>'
          +   '</span>'
          + '</button>';
  }
  html += '</div>';
  /* 结算 / 重开 */
  if(m.finished && m.result){
    html += '<div class="game-result">'
      +   '<div class="big">🎉 全部配对成功！</div>'
      +   '<div class="stars">'+('⭐'.repeat(m.result.stars))+'</div>'
      +   '<div class="sub subtitle">用时 '+m.result.time+' 秒 · 用了 '+m.steps+' 步 · '
      +     (m.result.capped ? '今日奖励已领完，本局无阳光' : '获得 ☀️ +'+m.result.points) + '</div>'
      +   '<button class="btn-primary" data-act="match-restart">🔄 再玩一次</button>'
      + '</div>';
  }else if(started){
    html += '<div style="text-align:center;margin-top:2px"><button class="pill small" data-act="match-restart">🔄 重新开始</button></div>';
  }else{
    html += '<div style="text-align:center;margin-top:2px"><button class="btn-primary" data-act="match-restart">▶ 开始游戏</button></div>';
  }
  html += '</div>';
  $('page-match').innerHTML = html;
}
function matchCard(i){
  var m = game.match;
  if(m.lock || m.finished) return;
  if(m.matchedSet[i] || m.first === i) return;    // 已配对/已翻开的不能重复点
  if(m.first === -1){                              // 翻开第一张
    m.first = i; renderMatch(); return;
  }
  m.second = i; m.steps++; m.lock = true; renderMatch();
  if(m.cards[m.first] === m.cards[m.second]){
    /* 配对成功：两张保持翻开，+1☀（静音加分，避免弹窗刷屏） */
    m.matchedSet[m.first] = true; m.matchedSet[m.second] = true;
    m.matched += 1;
    m.first = m.second = -1; m.lock = false;
    beep(true);
    addPoints(1, '', true);
    if(m.matched === MATCH_LEVELS[m.level].pairs){ finishMatch(); return; }
    renderMatch();
  }else{
    /* 配对失败：0.8 秒后自动翻回 */
    beep(false);
    setTimeout(function(){
      m.first = m.second = -1; m.lock = false; renderMatch();
    }, 800);
  }
}
function finishMatch(){
  var m = game.match, conf = MATCH_LEVELS[m.level];
  m.finished = true;
  var secs = Math.max(1, Math.round((Date.now() - m.startTime)/1000));
  var first = !state.matchDone[m.level];
  var points = first ? 3 : 1;                 // 首次通关 +3☀，重复通关 +1☀
  state.matchDone[m.level] = true;
  var best = state.matchBest[m.level];
  if(!best || m.steps < best.steps || (m.steps === best.steps && secs < best.time)){
    state.matchBest[m.level] = {steps:m.steps, time:secs};
  }
  save();
  var got = claimGameReward(points, first ? '首次通关「'+conf.name+'」难度' : '通关奖励');
  m.result = {stars:matchStars(m.steps, conf.pairs), time:secs, points:got ? points : 0, first:first, capped:!got};
  renderMatch();
}

/* ===== 18.3 抓大鹅（限时反应游戏） ===== */
var DUCK_TIME = 60;        // 每局 60 秒
var DUCK_MAX_POINTS = 10;  // 单局最多兑换 10☀（得分每 5 分换 1☀）
var duckGame = { score:0, timeLeft:DUCK_TIME, active:false, timer:null, spawnTimer:null, holes:[], result:null };

function renderDuck(){
  var g = duckGame;
  var html = '<div class="page-title">🦆 抓大鹅</div>'
    + '<div class="card">'
    +   '<h2>🦆 抓大鹅</h2>'
    +   '<div class="subtitle">大鹅🦆从洞里冒出来，快点它！+1分；点到僵尸🧟扣2分。60秒结束，每5分换1☀（最多'+DUCK_MAX_POINTS+'☀）</div>'
    +   '<div style="display:flex;gap:8px;margin:4px 0 2px">'
    +     '<button class="pill small'+(state.soundOn?' lv-active':'')+'" data-act="duck-sound">'+(state.soundOn?'🔊 音效开':'🔇 音效关')+'</button>'
    +     '<button class="pill small" data-act="duck-start">'+(g.active?'🔄 重新开始':'▶ 开始游戏')+'</button>'
    +   '</div>'
    +   '<div class="duck-hud">'
    +     '<div class="hud-box"><div class="v" id="duckScore">'+g.score+'</div><div class="k">当前得分</div></div>'
    +     '<div class="hud-box"><div class="v" id="duckTime">'+g.timeLeft+'</div><div class="k">剩余秒数</div></div>'
    +     '<div class="hud-box"><div class="v">'+(state.duckBest||0)+'</div><div class="k">最高分</div></div>'
    +   '</div>'
    +   '<div class="progress-hint">今日小游戏奖励还剩 '+gameRewardLeft()+' 次（每天最多'+GAME_DAILY_LIMIT+'次）</div>'
    +   '<div class="duck-grid" id="duckGrid">';
  for(var i=0;i<9;i++){
    html += '<div class="hole" data-act="duck-hit" data-i="'+i+'"><span class="duck-pop"></span></div>';
  }
  html += '</div>';
  if(g.result){
    html += '<div class="game-result">'
      +   '<div class="big">⏰ 时间到！</div>'
      +   '<div class="sub subtitle">本局得分 '+g.result.score+' 分'+(g.result.isBest?'（新纪录！🎉）':'')
      +     (g.result.capped ? ' · 今日奖励已领完，本局无阳光' : ' · 兑换 ☀️ +'+g.result.points)+'</div>'
      +   '<button class="btn-primary" data-act="duck-start">🔄 再玩一次</button>'
      + '</div>';
  }
  html += '</div>';
  $('page-duck').innerHTML = html;
  /* 记住 9 个洞，方便后续直接操作 DOM（不整页重绘，保证动画流畅） */
  duckGame.holes = [];
  var list = document.querySelectorAll('#page-duck .hole');
  for(var h=0;h<list.length;h++) duckGame.holes.push(list[h]);
}
function startDuck(){
  stopDuckGame();
  duckGame.score = 0; duckGame.timeLeft = DUCK_TIME; duckGame.active = true; duckGame.result = null;
  renderDuck();
  /* 倒计时 */
  duckGame.timer = setInterval(function(){
    duckGame.timeLeft--;
    var t = $('duckTime'); if(t) t.textContent = duckGame.timeLeft;
    if(duckGame.timeLeft <= 0) endDuck();
  }, 1000);
  scheduleDuckSpawn();
}
/* 冒出速度随时间加快：第1秒约1.1秒一只，第60秒约0.45秒一只 */
function scheduleDuckSpawn(){
  var delay = Math.max(450, 1100 - (DUCK_TIME - duckGame.timeLeft) * 12);
  duckGame.spawnTimer = setTimeout(function(){
    if(!duckGame.active) return;
    popDuck();
    scheduleDuckSpawn();
  }, delay);
}
function popDuck(){
  var i = Math.floor(Math.random() * duckGame.holes.length);
  var hole = duckGame.holes[i];
  if(!hole) return;
  var pop = hole.querySelector('.duck-pop');
  if(!pop || pop.classList.contains('show')) return;   // 这个洞正占着，换下次
  var isDuck = Math.random() < 0.62;                    // 62% 出大鹅，38% 出僵尸
  pop.textContent = isDuck ? '🦆' : '🧟';
  pop.dataset.type = isDuck ? 'duck' : 'zombie';
  pop.dataset.done = '';
  pop.classList.add('show');
  /* 停留时间也随时间缩短 */
  var stay = Math.max(520, 800 - (DUCK_TIME - duckGame.timeLeft) * 5);
  setTimeout(function(){
    pop.classList.remove('show');
    pop.dataset.done = '';
  }, stay);
}
function duckHit(i){
  if(!duckGame.active) return;
  var hole = duckGame.holes[i];
  if(!hole) return;
  var pop = hole.querySelector('.duck-pop');
  if(!pop || !pop.classList.contains('show') || pop.dataset.done === '1') return;
  pop.dataset.done = '1';                                // 防止一只被连点两次
  pop.classList.remove('show');
  if(pop.dataset.type === 'duck'){
    duckGame.score += 1;
    beep(true);
  }else{
    duckGame.score = Math.max(0, duckGame.score - 2);
    beep(false);
    var grid = $('duckGrid');
    if(grid){ grid.classList.add('shake'); setTimeout(function(){ grid.classList.remove('shake'); }, 300); }
  }
  var s = $('duckScore'); if(s) s.textContent = duckGame.score;
}
function endDuck(){
  duckGame.active = false;
  clearInterval(duckGame.timer); clearTimeout(duckGame.spawnTimer);
  /* 全部洞收起 */
  for(var i=0;i<duckGame.holes.length;i++){
    var pop = duckGame.holes[i].querySelector('.duck-pop');
    if(pop){ pop.classList.remove('show'); pop.dataset.done = ''; }
  }
  var pts = Math.min(DUCK_MAX_POINTS, Math.floor(duckGame.score / 5));
  var isBest = duckGame.score > (state.duckBest || 0);
  if(isBest){ state.duckBest = duckGame.score; }
  save();
  var got = false;
  if(pts > 0) got = claimGameReward(pts, '抓大鹅奖励');   // 受每日次数限制
  else toast('得分不足 5 分，没有阳光～再来一次！');
  duckGame.result = {score:duckGame.score, points:got ? pts : 0, isBest:isBest, capped:(pts > 0 && !got)};
  renderDuck();
}
/* 离开页面时结束本局（不发奖励，防止挂机刷分） */
function stopDuckGame(){
  if(!duckGame.active) return;
  duckGame.active = false;
  clearInterval(duckGame.timer); clearTimeout(duckGame.spawnTimer);
  for(var i=0;i<duckGame.holes.length;i++){
    var pop = duckGame.holes[i].querySelector('.duck-pop');
    if(pop) pop.classList.remove('show');
  }
}
function toggleSound(){
  state.soundOn = !state.soundOn;
  save();
  renderDuck();
  toast(state.soundOn ? '🔊 音效已开启' : '🔇 音效已关闭');
}

/* ===== 18.4 小游戏音效（Web Audio API，无需音频文件） ===== */
function beep(ok){
  if(!state.soundOn) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!beep.ctx) beep.ctx = new AC();
    var ctx = beep.ctx;
    if(ctx.state === 'suspended') ctx.resume();
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = ok ? 880 : 160;          // 对=高音，错=低音
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.18);
  }catch(e){}
}

/* ---------- 19. 全局事件委托 ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.dataset.act;
  if(act === 'nav')            switchPage(el.dataset.page);
  else if(act === 'open-pick') openPick(el.dataset.mode);
  else if(act === 'pick-item') pickItem(parseInt(el.dataset.idx,10));
  else if(act === 'answer')    handleAnswer(el.dataset.kind, parseInt(el.dataset.q,10), parseInt(el.dataset.o,10));
  else if(act === 'next')      nextQ(el.dataset.kind);
  else if(act === 'open-record') openRecord();
  else if(act === 'rec-toggle')  toggleRec();
  else if(act === 'rec-submit')  submitRecitation();
  else if(act === 'close-mask')  closeMask(el.dataset.target);
  else if(act === 'buy')         buyPlant(el.dataset.plant);
  /* ---- 运动打卡 / 对对碰 / 抓大鹅 ---- */
  else if(act === 'sport-toggle') sportToggle(parseInt(el.dataset.idx,10));
  else if(act === 'match-level')  startMatch(el.dataset.level);
  else if(act === 'match-restart') startMatch(game.match.level);
  else if(act === 'match-card')   matchCard(parseInt(el.dataset.i,10));
  else if(act === 'duck-start')   startDuck();
  else if(act === 'duck-hit')     duckHit(parseInt(el.dataset.i,10));
  else if(act === 'duck-sound')   toggleSound();
});
/* 点击遮罩空白处关闭弹窗 */
var masks = document.querySelectorAll('.mask');
for(var mi=0; mi<masks.length; mi++){
  masks[mi].addEventListener('click', function(e){
    if(e.target === this) closeMask(this.id);
  });
}

/* ---------- 20. 初始化 ---------- */
(function init(){
  buildSidebar();
  buildPickList();
  renderHeader();
  /* 自动定位到第一个未完成的课文/单元/古诗，刷新后接着学 */
  var firstLesson = -1;
  for(var i=0;i<LESSONS.length;i++){ if(state.lessonsDone.indexOf(i) === -1){ firstLesson = i; break; } }
  view.lesson = (firstLesson > -1) ? firstLesson : 0;
  view.lessonQ = firstUnanswered('L', view.lesson, LESSONS[view.lesson].qs.length);
  for(var m=0;m<MATH_UNITS.length;m++){ if(state.mathDone.indexOf(m) === -1){ view.math = m; break; } }
  view.mathQ = firstUnanswered('M', view.math, MATH_UNITS[view.math].qs.length);
  for(var e=0;e<EN_UNITS.length;e++){ if(state.enDone.indexOf(e) === -1){ view.en = e; break; } }
  view.enQ = firstUnanswered('E', view.en, EN_UNITS[view.en].qs.length);
  for(var j=0;j<POEMS.length;j++){ if(state.poemsDone.indexOf(j) === -1){ view.poem = j; break; } }
  view.poemQ = firstUnanswered('P', view.poem, POEMS[view.poem].qs.length);
  startMatch('normal');   // 进入对对碰前先发好一局牌（默认普通难度）
  switchPage('chinese');
})();
</script>
